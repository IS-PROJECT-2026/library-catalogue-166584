<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Library Catalogue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">Community Library Hub</div>
        <nav>
            <a href="#catalogue">Catalogue</a>
            <a href="#dashboard">My Dashboard</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Explore Our Digital Library</h1>
            <p>Browse books, check availability and manage your borrowing history effortlessly.</p>
            <input type="text" id="searchBar" placeholder="Search by title, author, or genre...">
        </section>

        <section id="catalogue" class="book-grid">
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
